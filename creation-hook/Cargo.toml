[package]
name = "tauiler-creation-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "tauiler_creation_hook"
crate-type = ["cdylib"]

[[bin]]
name = "tauiler-hook-host"
path = "src/host.rs"

[[bin]]
name = "tauiler-hook-probe"
path = "src/probe.rs"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
